
name: buildAndPush
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  buildAndPush:
    name: build and push to acr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "cf24936b-bab1-4bd5-a84a-f40b4e9661cf"
          tenant-id: "50b4c848-d426-4de1-ad70-fb13c2692bc9"
          subscription-id: "2725a90a-ca7e-4474-afbb-38294afb9db3"

      - name: Login to ACR
        run: az acr login --name rituacr123

      - name: Build Docker Image
        run: docker build -t rituacr123.azurecr.io/hello/uirepo1:v2 .

      - name: Push Docker Image
        run: docker push rituacr123.azurecr.io/hello/uirepo1:v2 .
